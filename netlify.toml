# NearBuy Deployment Configuration for Netlify (Static Frontend + API Proxy)
#
# IMPORTANT ARCHITECTURE NOTE:
# NearBuy runs a stateful Node 22 HTTP + SQLite + SSE backend (`npm start`, server/index.js).
# Netlify hosts static frontend files and proxies /api/* to your deployed NearBuy Node backend.
# Replace https://YOUR-NEARBUY-BACKEND.example with your actual hosted Node backend URL
# (e.g. Railway, Render, Fly.io, or VPS with persistent disk for NEARBUY_DB_FILE).

[build]
  publish = "."
  command = "node -e \"console.log('Static publish ready. Run Node backend separately via npm start.')\""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Uncomment and set your live Node backend URL to proxy API & SSE traffic through Netlify:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-NEARBUY-BACKEND.example/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/admin"
  to = "/control-tower/"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "/control-tower/"
  status = 302

[[redirects]]
  from = "/customer/login"
  to = "/customer/#/login"
  status = 302

[[redirects]]
  from = "/seller/app/*"
  to = "/seller/app/:splat"
  status = 200

[[redirects]]
  from = "/seller/*"
  to = "/seller/index.html"
  status = 200
